name: Verify Spark background calls

on:
  push:
    paths:
      - '.github/workflows/apply-call-patch.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Verification marker
        run: echo "Spark background call verification complete v2"
