name: Build Spark 2 Android
on:
  push:
    branches: [spark-2-preview]
    paths:
      - 'spark2/**'
      - '.github/workflows/spark-2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spark-2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spark2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spark2/package-lock.json
      - name: Test database rules and deletion handler
        run: npm ci --ignore-scripts && npm test
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, run JVM tests and lint
        run: chmod +x gradlew && ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Spark-2-debug-APK
          path: spark2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Spark-2-build-reports
          path: |
            spark2/core/build/reports/tests/
            spark2/app/build/reports/
          retention-days: 14
